# Kinetic configuration.
# Every key can be overridden by a JVM property (-Ddb.url=...) or by an environment
# variable named KINETIC_ + the key in upper case with dots as underscores
# (for example KINETIC_GOOGLE_CLIENT_ID).

# JDBC connection. The default is an embedded H2 file database created in ./data.
# MySQL example: jdbc:mysql://localhost:3306/kinetic  (add the MySQL driver to pom.xml)
db.url=jdbc:h2:file:./data/kinetic;DB_CLOSE_DELAY=-1
db.user=sa
db.password=
db.pool.size=8

# OAuth 2.0 client ID from Google Cloud Console. Leave empty to disable Google sign-in.
google.client.id=

# Seed a demo account (demo@kinetic.app) with 16 weeks of sample workouts on first start.
demo.enabled=true

# Set to true when the site is served over HTTPS (production). Marks the session cookie Secure and sends HSTS.
cookie.secure=false
