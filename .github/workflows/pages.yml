name: Deploy Kinetic demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "docs/index.html"
      - "docs/styles.css"
      - "docs/app.js"
      - "docs/favicon.svg"
      - "docs/404.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare the site
        shell: bash
        run: |
          mkdir -p _site
          cp docs/index.html docs/styles.css docs/app.js docs/favicon.svg docs/404.html docs/.nojekyll _site/
      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
